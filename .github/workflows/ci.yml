name: CI
on:
  push:
    branches: [main, recruiting-demo-v1]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: python -m pip install -e '.[dev,demo-hybrid,sentencing]' faiss-cpu rank-bm25 iterative-stratification requests
      - run: pytest -q
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/evaluate_demo.py --mock-provider
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
